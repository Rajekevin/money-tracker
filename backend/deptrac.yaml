# Architecture rules, checked in CI: dependencies only point inwards.
#   Infrastructure -> Application -> Domain
# The Domain knows nothing about Symfony, Doctrine or any other framework.
deptrac:
    paths:
        - ./src
    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/.*
        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*
        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*
        - name: Framework
          collectors:
              - type: classLike
                value: ^(Symfony|Doctrine|Psr|Monolog)\\.*
    ruleset:
        Domain: ~
        Application:
            - Domain
        Infrastructure:
            - Application
            - Domain
            - Framework
